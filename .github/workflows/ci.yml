name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no third-party dependencies)
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Check catalog is up to date
        run: cloud-checks list --format md | diff - docs/CHECKS.md
      - name: Demo scans (offline)
        run: |
          cloud-checks aws --demo --fail-on none
          cloud-checks azure --demo --fail-on none
          cloud-checks gcp --demo --fail-on none
      - uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: reports/
